      <text x="12" y="92" font-size="11" fill="#4a5273">• Target: AuthZ &amp; Token Claims</text>
      <text x="12" y="110" font-size="11" fill="#4a5273">• Dynamic: <b>Up to 5 Rounds</b></text>
      
