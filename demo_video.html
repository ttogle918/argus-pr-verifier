<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Argus-PR — Guided E2E Demo Video Player (🔴 1 ~ 🔴 7)</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #111827;
      --border: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #ef4444;
      --cyan: #38bdf8;
      --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      padding: 24px;
      line-height: 1.5;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-size: 1.35rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--accent);
      color: #fca5a5;
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
    }
    .links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-link {
      text-decoration: none;
      color: var(--text);
      background: #1e293b;
      border: 1px solid #334155;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.15s;
    }
    .btn-link:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .player-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      margin-bottom: 20px;
    }
    video {
      width: 100%;
      border-radius: 10px;
      background: #000;
      border: 1px solid #374151;
      display: block;
    }
    .chapters-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--muted);
      margin: 16px 0 10px;
    }
    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }
    .chapter-btn {
      background: #1a2234;
      border: 1px solid #2dd4bf33;
      border-left: 4px solid var(--accent);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chapter-btn:hover {
      background: #243049;
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .chapter-step {
      font-weight: 800;
      color: #fca5a5;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .chapter-desc {
      font-size: 0.8rem;
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">
        🛡️ Argus-PR — Guided E2E Demo Video
        <span class="badge">🔴 1 ~ 🔴 7 + Stage 0 Guardrail</span>
      </div>
      <div class="links">
        <a class="btn-link" href="https://argus-pr-verifier-987693331070.asia-northeast3.run.app/" target="_blank">🚀 Open Live Cloud Run App</a>
        <a class="btn-link" href="https://github.com/ttogle918/argus-pr-verifier" target="_blank">🌐 GitHub Repository</a>
        <a class="btn-link" href="https://raw.githubusercontent.com/ttogle918/argus-pr-verifier/main/argus_pr_demo.webm" target="_blank">⬇ Download .webm (9.5 MB)</a>
      </div>
    </div>

    <div class="player-card">
      <video id="demo-video" controls autoplay loop muted playsinline>
        <source src="./argus_pr_demo.webm" type="video/webm" />
        <source src="https://raw.githubusercontent.com/ttogle918/argus-pr-verifier/main/argus_pr_demo.webm" type="video/webm" />
        Your browser does not support HTML5 WebM video.
      </video>

      <div class="chapters-title">🧭 Click any numbered step below to jump directly to that moment in the video:</div>
      <div class="chapter-grid">
        <button class="chapter-btn" onclick="seekTo(0.5)">
          <div class="chapter-step"><span>🔴 1 PR Diff 보기</span><span>0:01</span></div>
          <div class="chapter-desc">#toggle-diff-btn — PR #3 (Cisco sandbox.py) 코드 변경점 확인</div>
        </button>
        <button class="chapter-btn" onclick="seekTo(2.2)">
          <div class="chapter-step"><span>🔴 2 블라인드 검증 스웜 실행</span><span>0:02</span></div>
          <div class="chapter-desc">#launch-btn — Stage 0~3 듀얼 트랙 스웜 & 5회 적응형 레드팀 퍼징</div>
        </button>
        <button class="chapter-btn" onclick="seekTo(7.0)">
          <div class="chapter-step"><span>🔴 3 Multi-Persona BOLA DAST</span><span>0:07</span></div>
          <div class="chapter-desc">#run-live-dast-bola-btn — Victim vs Attacker vs Anon 권한 우회 검증</div>
        </button>
        <button class="chapter-btn" onclick="seekTo(9.0)">
          <div class="chapter-step"><span>🔴 4 & 4-1 + 커스텀 버그 심기</span><span>0:09</span></div>
          <div class="chapter-desc">#toggle-mutant-form-btn — 커스텀 인공 버그 주입 및 MSI 실시간 재계산</div>
        </button>
        <button class="chapter-btn" onclick="seekTo(12.2)">
          <div class="chapter-step"><span>🔴 5 권장 패치 적용 후 재검증</span><span>0:12</span></div>
          <div class="chapter-desc">#apply-patch-btn — Blue-Team CEGIS 4-Gate 루프 (Attempt 1 실패 → Attempt 2 통과)</div>
        </button>
        <button class="chapter-btn" onclick="seekTo(14.5)">
          <div class="chapter-step"><span>🔴 6 Export PR + Regression Test</span><span>0:14</span></div>
          <div class="chapter-desc">#export-bundle-btn — 검증된 패치 Diff + 고정 pytest 회귀 테스트 추출</div>
        </button>
        <button class="chapter-btn" onclick="seekTo(16.8)">
          <div class="chapter-step"><span>🔴 7 병합 최종 승인</span><span>0:17</span></div>
          <div class="chapter-desc">#approve-btn — Human-in-the-Loop 최종 승인 및 감사 로그 기록</div>
        </button>
        <button class="chapter-btn" onclick="seekTo(18.5)">
          <div class="chapter-step"><span>🛡️ BONUS: PR #666 인젝션 차단</span><span>0:18</span></div>
          <div class="chapter-desc">Stage 0 (gemini-3.5-flash-lite) 프롬프트 인젝션 즉시 격리</div>
        </button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('demo-video');
    function seekTo(sec) {
      video.currentTime = sec;
      video.play();
    }
  </script>
</body>
</html>
