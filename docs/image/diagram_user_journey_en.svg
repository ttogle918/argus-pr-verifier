      <text x="10" y="48" font-size="10.5" fill="#4a5273">• Pass(orig) ∧ Fail(mutant)</text>
      <text x="10" y="62" font-size="10.5" fill="#2544a8" font-weight="600">• 100% Deterministic Python math</text>
